<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEXNOTE. 我的法律書房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E6; --paper:#FCFAF5; --paper2:#F0E9DC; --ink:#2A2520; --ink2:#6E6458; --ink3:#9C9284;
  --line:#E2D8C7; --accent:#8A3A2C; --accent-soft:#F3E3D9; --gold:#A8843A;
  --amber:#FBF0D3; --amber-b:#D9B65C; --blue:#E3ECF3; --blue-b:#7C9DB8; --red:#F7E1DE; --red-b:#C47A6E; --green:#E3EFE2; --green-b:#7FA67A;
  --mark:#F8E59B; --shadow:0 1px 2px rgba(60,40,20,.05),0 4px 16px rgba(60,40,20,.05);
  --mk-a:rgba(248,214,110,.6); --mk-pink:rgba(232,170,160,.34); --mk-blue:rgba(140,170,200,.3); --mk-ul:rgba(160,70,55,.75);
  --serif:'Noto Serif TC',serif; --sans:'Noto Sans TC',system-ui,sans-serif; --latin:'Cormorant Garamond',serif;
}
[data-theme=dark]{
  --bg:#171614; --paper:#201E1B; --paper2:#2A2723; --ink:#ECE5D8; --ink2:#AFA597; --ink3:#7E7569;
  --line:#37322C; --accent:#D99478; --accent-soft:#3A2A23; --gold:#CBA75E;
  --amber:#3A3220; --amber-b:#9C8240; --blue:#1F2B35; --blue-b:#5D7F9B; --red:#3A2421; --red-b:#A0625A; --green:#22301F; --green-b:#5F8A5A;
  --mark:#6B5A1E; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --mk-a:rgba(200,160,60,.45); --mk-pink:rgba(200,120,110,.32); --mk-blue:rgba(110,150,190,.32); --mk-ul:rgba(230,140,120,.85);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.7}
label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 5px;font-weight:500}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.logo{font-family:var(--latin);font-weight:700;font-size:25px;letter-spacing:.06em;cursor:pointer;user-select:none;color:var(--ink);text-decoration:none}
.logo span{color:var(--accent)}
.nav{display:flex;gap:4px;flex:1}
.nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink2);font-size:14.5px}
.nav a.on,.nav a:hover{background:var(--paper2);color:var(--ink)}
.icon-btn{border:none;background:none;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:var(--paper2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.save-state{font-size:12.5px;color:var(--ink3);min-width:52px;text-align:right}

.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 90px}
.crumbs{font-size:13.5px;color:var(--ink3);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--ink2);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.crumbs i{font-style:normal;opacity:.5}

h1,h2,h3,h4{font-family:var(--serif);line-height:1.4;margin:0}
.h1{font-size:34px;font-weight:900;letter-spacing:.02em}
.sub{color:var(--ink2);margin-top:6px}
.eyebrow{font-family:var(--latin);letter-spacing:.2em;font-size:13px;color:var(--gold);font-weight:700;text-transform:uppercase}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 15px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme=dark] .btn.pri{color:#1a1310}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--paper2);color:var(--ink)}
.btn.danger{color:#B4483A}
.btn.sm{padding:4px 11px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* hero */
.hero{padding:40px 0 30px;text-align:center}
.hero .h1{font-size:40px;margin-top:6px}
.searchbox{position:relative;max-width:620px;margin:26px auto 0}
.searchbox input{padding:15px 20px 15px 50px;border-radius:999px;font-size:16.5px;background:var(--paper);box-shadow:var(--shadow)}
.searchbox svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;color:var(--ink3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-2px);border-color:var(--ink3)}
.card h3{font-size:21px;font-weight:700}
.card .meta{font-size:13px;color:var(--ink3);margin-top:10px}
.card.add{border-style:dashed;box-shadow:none;background:transparent;display:grid;place-items:center;color:var(--ink3);min-height:118px}
.card.add:hover{color:var(--accent);border-color:var(--accent)}
.subj-mark{position:absolute;right:18px;top:16px;font-family:var(--serif);font-size:44px;line-height:1;color:var(--paper2);font-weight:900;pointer-events:none}

.section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sec-head h2{font-size:21px;font-weight:700}
.sec-num{font-family:var(--latin);font-size:22px;color:var(--gold);font-weight:700;min-width:26px}
.empty{color:var(--ink3);font-size:14.5px;padding:18px 0}

.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;transition:border-color .15s}
.item:hover{border-color:var(--ink3)}
.item-t{font-family:var(--serif);font-weight:700;font-size:17px}
.item-s{color:var(--ink2);font-size:14px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ref{font-size:12.5px;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:5px;margin-left:8px;font-family:var(--sans);font-weight:500;white-space:nowrap}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--paper2);color:var(--ink2);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.tag.t-高頻考點{background:var(--red);border-color:var(--red-b)}
.tag.t-易混淆{background:var(--amber);border-color:var(--amber-b)}
.tag.t-待複習{background:var(--blue);border-color:var(--blue-b)}
.tag.t-實務見解{background:var(--green);border-color:var(--green-b)}

/* chapter layout */
.ch-layout{display:grid;grid-template-columns:200px 1fr;gap:40px;margin-top:30px}
.toc{position:sticky;top:80px;align-self:start;font-size:14.5px}
.toc-t{font-size:12px;letter-spacing:.15em;color:var(--ink3);margin-bottom:10px}
.toc a{display:flex;gap:10px;padding:6px 0;color:var(--ink2);text-decoration:none;border-left:2px solid var(--line);padding-left:12px}
.toc a:hover{color:var(--accent);border-color:var(--accent)}
.toc a b{font-family:var(--latin);color:var(--gold);font-weight:700}
@media (max-width:800px){.ch-layout{grid-template-columns:1fr}.toc{display:none}.hero .h1{font-size:32px}.h1{font-size:28px}.nav a{padding:6px 8px}}
@media (max-width:560px){.nav{display:none}.top-in{gap:8px}.mnav{display:flex!important}}
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.mnav a{text-decoration:none;color:var(--ink2);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 14px}
.mnav a.on{color:var(--accent)}
.mnav svg{width:21px;height:21px}

.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dia{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;cursor:zoom-in}
.dia img{width:100%;height:190px;object-fit:contain;display:block;background:#fff}
.dia .cap{padding:8px 12px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dia .x{opacity:0;transition:opacity .15s}
.dia:hover .x{opacity:1}
@media (hover:none){.dia .x{opacity:1}}

/* judgment & question cards */
.jcard{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:14px 18px}
.jcard .jt{font-family:var(--serif);font-weight:700;font-size:16.5px}
.jcard .jm{font-size:13px;color:var(--ink3);margin-top:2px}
.jcard .ji{margin-top:8px;font-size:14.5px}
.jcard .ji b{color:var(--accent);font-weight:500}
.jcard .js{margin-top:6px;font-size:14.5px;color:var(--ink2);white-space:pre-wrap}
.qcard{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:14px 18px}
.qcard .qt{font-weight:700;font-family:var(--serif)}
.qcard .qc{margin-top:8px;font-size:15px;white-space:pre-wrap}
.qcard details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.qcard summary{cursor:pointer;font-size:14px;color:var(--accent)}
.qcard .qa{white-space:pre-wrap;font-size:14.5px;margin-top:8px;color:var(--ink)}
.status{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12.5px}
.status button{border:none;background:none;padding:3px 10px;cursor:pointer;color:var(--ink3)}
.status button.on.s0{background:var(--paper2);color:var(--ink)}
.status button.on.s1{background:var(--amber);color:var(--ink)}
.status button.on.s2{background:var(--green);color:var(--ink)}
.linkchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.linkchip{font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;cursor:pointer;text-decoration:none;background:var(--bg)}
.linkchip:hover{border-color:var(--accent);color:var(--accent)}

/* doc / rich content */
.doc{font-size:16.5px;line-height:1.95}
.doc h2{font-size:22px;margin:1.3em 0 .5em}
.doc h3{font-size:18.5px;margin:1.2em 0 .4em}
.doc p{margin:.5em 0}
.doc mark{background:linear-gradient(transparent 58%,var(--mk-a) 58%);color:inherit;padding:0 1px}
.doc .hl-pink{background:var(--mk-pink);border-radius:4px;padding:1px 3px}
.doc .hl-blue{background:var(--mk-blue);border-radius:4px;padding:1px 3px}
.doc .ul-red{text-decoration:underline;text-decoration-color:var(--mk-ul);text-decoration-thickness:2px;text-underline-offset:5px}
.doc img{max-width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.doc table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
.doc td,.doc th{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
.doc th{background:var(--paper2)}
.doc blockquote{margin:12px 0;padding:4px 16px;border-left:3px solid var(--line);color:var(--ink2)}
.doc hr{border:none;border-top:1px solid var(--line);margin:22px 0}
.doc .callout{border-radius:10px;padding:12px 16px;margin:14px 0;border:1px solid}
.doc .callout.amber{background:var(--amber);border-color:var(--amber-b)}
.doc .callout.blue{background:var(--blue);border-color:var(--blue-b)}
.doc .callout.red{background:var(--red);border-color:var(--red-b)}
.doc .callout.green{background:var(--green);border-color:var(--green-b)}
.doc .c-red{color:#B4483A}
[data-theme=dark] .doc .c-red{color:#E58C7E}
.doc a.plink{background:var(--accent-soft);text-decoration:none;padding:0 6px;border-radius:5px;font-size:.92em}

.paper{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 30px;box-shadow:var(--shadow)}
@media (max-width:560px){.paper{padding:18px 16px}}

/* editor */
.ed{border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.ed-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);position:sticky;top:57px;background:var(--paper);z-index:5;border-radius:12px 12px 0 0}
.ed-bar button{border:none;background:none;cursor:pointer;padding:5px 9px;border-radius:6px;font-size:13.5px;color:var(--ink2);min-width:32px}
.ed-bar button:hover{background:var(--paper2);color:var(--ink)}
.ed-bar .sep{width:1px;background:var(--line);margin:4px 3px}
.ed-area{padding:18px 22px;min-height:260px;outline:none}
.ed-area:empty:before{content:attr(data-ph);color:var(--ink3)}
.ed-bar .done{background:var(--accent);color:#fff;font-weight:700}
body.editing .mnav{display:none!important}
[data-theme=dark] .ed-bar .done{color:#1a1310}
.ed-area img.picked{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:700px){
  .ed-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:6px 4px}
  .ed-bar::-webkit-scrollbar{display:none}
  .ed-bar button{flex:0 0 auto;padding:9px 11px;font-size:14.5px}
  .ed-area{padding:14px 14px;min-height:200px}
}

/* modal */
.mask{position:fixed;inset:0;background:rgba(30,22,15,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;animation:fade .15s}
.modal{background:var(--paper);border-radius:16px;width:100%;max-width:620px;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:20px;margin-bottom:6px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
@keyframes fade{from{opacity:0}}
.picker{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px}
.picker .pg{font-size:12.5px;color:var(--ink3);margin:8px 0 2px}
.picker label{display:flex;gap:8px;align-items:center;margin:2px 0;font-size:14.5px;color:var(--ink);font-weight:400;cursor:pointer}
.picker label input{width:auto}
.picker .pl{padding-left:18px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel .tag.on{outline:2px solid var(--accent);color:var(--ink)}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:grid;place-items:center;cursor:zoom-out;padding:20px}
.lightbox img{max-width:100%;max-height:92vh;background:#fff;border-radius:6px}

.banner{background:var(--red);border:1px solid var(--red-b);padding:10px 16px;border-radius:10px;margin-bottom:18px;font-size:14.5px}
.hl{background:var(--mark);color:inherit;border-radius:2px}
.stat{display:flex;gap:28px;justify-content:center;margin-top:22px;color:var(--ink3);font-size:13.5px}
.stat b{display:block;font-family:var(--latin);font-size:28px;color:var(--ink);line-height:1.1}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:360px;text-align:center}
.login .logo{font-size:42px}
.err{color:#B4483A;font-size:14px;margin-top:10px;min-height:20px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;z-index:70;animation:fade .2s}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filters select,.filters input{width:auto;padding:6px 12px;font-size:14px;border-radius:999px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============ utilities ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const stripHtml = h => { const d=document.createElement('div'); d.innerHTML=h||''; d.querySelectorAll('img').forEach(i=>i.remove()); d.querySelectorAll('p,div,h2,h3,h4,li,br,td,th,tr').forEach(e=>e.after(' ')); return (d.textContent||'').replace(/\s+/g,' ').trim(); };
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} } };
const fmtDate = t => { if(!t) return ''; const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

const IC = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',

/* ============ storage ============ */
const Store = {
  mode:'local', ver:0,
  async init(){
    this.mode='local';
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    let d=null; try{ d=await idbGet('__db__'); }catch(e){}
    if(!d) d=ls.get('lexnote-db', null);
    return {db: d};
  },
  async save(db){
    if(this.mode==='local'){ const ok=await idbPutWait('__db__', JSON.parse(JSON.stringify(db))); if(!ok){ try{ localStorage.setItem('lexnote-db',JSON.stringify(db)); }catch(e){ throw new Error('full'); } } return true; }
    const r = await fetch('/api/db',{method:'PUT',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({db,ver:this.ver})});
    if(r.status===409){ throw new Error('conflict'); }
    if(r.status===401){ throw new Error('auth'); }
    if(!r.ok) throw new Error('fail');
    const j=await r.json(); this.ver=j.ver; return true;
  },
  imgCache:{},
  async putImg(dataURL){
    const id='i'+uid();
    if(this.mode==='api'){
      const r = await fetch('/api/img',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({id,data:dataURL})});
      if(!r.ok) throw new Error('img');
      return id;
    }
    this.imgCache[id]=dataURL; idbPut(id,dataURL); return id;
  },
  async imgSrc(id){
    if(this.mode==='api') return '/api/img/'+encodeURIComponent(id);
    if(this.imgCache[id]) return this.imgCache[id];
    const v = await idbGet(id); if(v) this.imgCache[id]=v; return v||'';
  }
};
let _idb=null;
function idb(){ if(_idb) return _idb; _idb=new Promise((res)=>{ try{ const q=indexedDB.open('lexnote',1); q.onupgradeneeded=()=>q.result.createObjectStore('img'); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null);}catch(e){res(null);} }); return _idb; }
async function idbPut(k,v){ const d=await idb(); if(!d) return; try{ d.transaction('img','readwrite').objectStore('img').put(v,k);}catch(e){} }
async function idbPutWait(k,v){ const d=await idb(); if(!d) return false; return new Promise(res=>{ try{ const t=d.transaction('img','readwrite'); t.objectStore('img').put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>res(false); t.onabort=()=>res(false);}catch(e){res(false);} }); }
async function idbGet(k){ const d=await idb(); if(!d) return null; return new Promise(res=>{ try{ const q=d.transaction('img').objectStore('img').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null);}catch(e){res(null);} }); }
async function resolveImgs(root){ for(const im of $$('img[data-img]',root)){ const s=await Store.imgSrc(im.dataset.img); if(s) im.src=s; } }

/* image compression: keeps diagrams readable, under ~1.4MB */
function fileToCompressed(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      let max=2000, q=0.9, out='';
      for(let i=0;i<6;i++){
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL('image/webp',q); if(!out.startsWith('data:image/webp')) out=c.toDataURL('image/jpeg',q);
        if(out.length<1400000) break; max*=0.8; q-=0.08;
      }
      res(out);
    }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function viewSearch(){
  const q=searchQ.trim(); let body='';
  if(q){
    const tagMode=q.startsWith('#'); const k=(tagMode?q.slice(1):q).toLowerCase();
    const hit=(fields,tags)=> tagMode ? (tags||[]).some(t=>t.toLowerCase()===k) : fields.join(' ').toLowerCase().includes(k);
    const cs=db.chapters.filter(c=>hit([c.name,c.ref,c.part,stripHtml(c.supplement)],c.tags));
    const ps=db.points.filter(p=>hit([p.title,p.ref,stripHtml(p.html),stripHtml(p.note)],p.tags));
    const js=db.judgments.filter(j=>hit([j.court,j.no,j.issue,j.summary],j.tags));
    const qs=db.questions.filter(x=>hit([x.exam,x.year,x.content,x.answer],x.tags));
    const total=cs.length+ps.length+js.length+qs.length;
    const snip=(text)=>{ if(tagMode) return esc(text.slice(0,110)); const i=text.toLowerCase().indexOf(k); const st=Math.max(0,i-40); const s=text.slice(st,st+130); return (st?'…':'')+esc(s).replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<span class="hl">${m}</span>`); };
    body=`<div class="sub" style="margin:14px 0">找到 ${total} 筆</div>
    ${cs.length?`<div class="section"><div class="sec-head"><h2>章節</h2></div><div class="list">${cs.map(c=>`<div class="item" data-go="c-${c.id}"><div class="item-t">${esc(c.name)}</div><div class="item-s">${esc(c.ref||'')}</div></div>`).join('')}</div></div>`:''}
    ${ps.length?`<div class="section"><div class="sec-head"><h2>條文</h2></div><div class="list">${ps.map(p=>`<div class="item" data-go="p-${p.id}"><div class="item-t">${esc(p.title)}${p.ref?`<span class="ref">${esc(p.ref)}</span>`:''}</div><div class="item-s">${snip(stripHtml((p.html||'')+' '+(p.note||'')))}</div>${tagsHtml(p.tags)}</div>`).join('')}</div></div>`:''}
    ${js.length?`<div class="section"><div class="sec-head"><h2>判決</h2></div><div class="list">${js.map(judgmentCard).join('')}</div></div>`:''}
    ${qs.length?`<div class="section"><div class="sec-head"><h2>考題</h2></div><div class="list">${qs.map(questionCard).join('')}</div></div>`:''}`;
  }
  const alltags=[...new Set([...db.points,...db.chapters,...db.judgments,...db.questions].flatMap(x=>x.tags||[]))];
  return `<div class="eyebrow">Search</div><h1 class="h1">搜尋</h1>
  <form class="searchbox" data-form="search" style="margin:18px 0 0;max-width:none">${IC.search}<input name="q" value="${esc(searchQ)}" placeholder="搜尋條文、罪名、判決、考題…" autocomplete="off"></form>
  ${alltags.length?`<div class="tags" style="margin-top:14px">${alltags.map(t=>`<span class="tag t-${esc(t)}" data-act="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</div>`:''}${body}`;
}

let editing=null; // "id:field"
function render(){
  const app=$('#app'); let inner='';

  if(r.name==='subject'){ const s=db.subjects.find(x=>x.id===r.id); inner=s?viewSubject(s):notFound(); }

const notFound=()=>`<div class="empty">找不到這一頁，可能已經被刪除了。<a href="#">回書房</a></div>`;

function mountDoc(slot){
  const obj=byId(slot.dataset.id), field=slot.dataset.field, key=obj.id+':'+field;

/* ============ editor ============ */
const ALLOWED=new Set(['P','BR','B','STRONG','I','EM','U','UL','OL','LI','H2','H3','H4','TABLE','THEAD','TBODY','TR','TD','TH','A','MARK','BLOCKQUOTE','DIV','SPAN','HR','IMG','SUB','SUP']);
function sanitize(html){
  const d=document.createElement('div'); d.innerHTML=html;
  (function walk(n){ for(const c of [...n.childNodes]){
    if(c.nodeType===1){
      if(['SCRIPT','STYLE','META','LINK','TITLE','XML','O:P'].includes(c.tagName)){ c.remove(); continue; }
      walk(c);
      if(!ALLOWED.has(c.tagName)){ c.replaceWith(...c.childNodes); continue; }
      const keep={A:['href'],IMG:['data-img'],TD:['colspan','rowspan'],TH:['colspan','rowspan']}[c.tagName]||[];
      const cls=c.getAttribute('class')||'';
      for(const a of [...c.attributes]) if(!keep.includes(a.name)) c.removeAttribute(a.name);
      if(/callout|c-red|plink|hl-pink|hl-blue|ul-red/.test(cls)) c.setAttribute('class',cls.split(/\s+/).filter(x=>/^(callout|amber|blue|red|green|c-red|plink|hl-pink|hl-blue|ul-red)$/.test(x)).join(' '));
      if(c.tagName==='A'){ const h=c.getAttribute('href')||''; if(/^javascript:/i.test(h)) c.removeAttribute('href'); else if(!h.startsWith('#')){ c.setAttribute('target','_blank'); c.setAttribute('rel','noopener'); } }
      if(c.tagName==='IMG' && !c.getAttribute('data-img')) c.remove();
      if(c.tagName==='SPAN' && !c.getAttribute('class')) c.replaceWith(...c.childNodes);
    } else if(c.nodeType===8) c.remove();
  }})(d);
  return d.innerHTML;
}
function serialize(area){ const c=area.cloneNode(true); $$('img[data-img]',c).forEach(i=>i.removeAttribute('src')); return sanitize(c.innerHTML); }

function makeEditor(html,onChange,ph,onDone){
  const w=document.createElement('div'); w.className='ed';
  const B=(a,l,t)=>`<button type="button" data-ed="${a}" title="${t||''}">${l}</button>`;
  w.innerHTML=`<div class="ed-bar"><button type="button" data-ed="done" class="done">✓ 完成</button>${B('h2','<b>大標</b>')}${B('h3','<b>小標</b>')}${B('p','內文')}<span class="sep"></span>${B('bold','<b>B</b>','粗體')}${B('italic','<i>I</i>','斜體')}${B('underline','<u>U</u>','底線')}${B('hlmenu','<span style="background:linear-gradient(transparent 55%,var(--mk-a) 55%);padding:0 2px">畫重點</span> ▾','選一種畫重點的樣式')}${B('red','<span style="color:#B4483A">紅字</span>')}<span class="sep"></span>${B('ul','• 清單')}${B('ol','1. 編號')}<span class="sep"></span>${B('c-amber','🟨 重點')}${B('c-blue','🟦 提醒')}${B('c-red','🟥 易混淆')}${B('c-green','🟩 實務')}<span class="sep"></span>${B('table','表格')}${B('img','圖片')}${B('link','連結')}${B('plink','連條文')}${B('hr','分隔線')}${B('clear','清除格式')}${B('delblock','🗑 刪除方塊','刪除游標所在的提示框、表格或點選的圖片')}</div>
  <div class="ed-area doc" contenteditable="true" data-ph="${esc(ph)}"></div><input type="file" accept="image/*" hidden>`;
  const area=$('.ed-area',w), file=$('input[type=file]',w), bar=$('.ed-bar',w); const mainBar=bar.innerHTML;
  const hlBar=`<button type="button" data-ed="hl-back">‹ 返回</button>${B('mark','<span style="background:linear-gradient(transparent 55%,var(--mk-a) 55%);padding:0 2px">螢光</span>','半截螢光')}${B('hl-pink','<span style="background:var(--mk-pink);border-radius:3px;padding:0 4px">粉底</span>','粉色底')}${B('hl-blue','<span style="background:var(--mk-blue);border-radius:3px;padding:0 4px">藍底</span>','藍色底')}${B('ul-red','<span style="text-decoration:underline;text-decoration-color:var(--mk-ul);text-decoration-thickness:2px;text-underline-offset:4px">底線</span>','紅色底線')}${B('hl-none','取消標記','把選取文字的標記拿掉')}`;
  const wrapSel=(tag,cls)=>{ const s=getSelection(); if(!s.rangeCount||s.isCollapsed) return false; const r=s.getRangeAt(0); if(!area.contains(r.commonAncestorContainer)) return false;
    const el=document.createElement(tag); if(cls) el.className=cls; el.appendChild(r.extractContents()); r.insertNode(el);
    el.querySelectorAll('mark,span.hl-pink,span.hl-blue,span.ul-red').forEach(x=>x.replaceWith(...x.childNodes));
    const nr=document.createRange(); nr.selectNodeContents(el); s.removeAllRanges(); s.addRange(nr); saved=nr.cloneRange(); return true; };
  const unmarkSel=()=>{ const s=getSelection(); if(!s.rangeCount) return; const r=s.getRangeAt(0); const isM=x=>x.nodeType===1&&(x.tagName==='MARK'||/\b(hl-pink|hl-blue|ul-red)\b/.test(x.className||''));
    const hits=new Set(); let n=r.commonAncestorContainer; while(n&&n!==area){ if(isM(n)) hits.add(n); n=n.parentNode; }
    const root=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentNode;
    root.querySelectorAll&&root.querySelectorAll('mark,span.hl-pink,span.hl-blue,span.ul-red').forEach(x=>{ if(r.intersectsNode(x)) hits.add(x); });
    hits.forEach(x=>x.replaceWith(...x.childNodes)); area.normalize(); };
  area.innerHTML=html; resolveImgs(area);
  let t=null; const changed=()=>{ clearTimeout(t); t=setTimeout(()=>onChange(serialize(area)),400); setSave('編輯中…'); };
  area.addEventListener('input',changed);
  area.addEventListener('paste',e=>{
    const items=[...(e.clipboardData?.items||[])]; const im=items.find(i=>i.type.startsWith('image/'));
    if(im){ e.preventDefault(); insertImageFile(im.getAsFile()); return; }
    const h=e.clipboardData.getData('text/html');
    if(h){ e.preventDefault(); document.execCommand('insertHTML',false,sanitize(h)); }
  });
  let saved=null; const keep=()=>{ const s=getSelection(); if(s.rangeCount && area.contains(s.anchorNode)) saved=s.getRangeAt(0).cloneRange(); };
  const restore=()=>{ area.focus(); if(saved){ const s=getSelection(); s.removeAllRanges(); s.addRange(saved); } };
  area.addEventListener('keyup',keep); area.addEventListener('mouseup',keep); area.addEventListener('blur',keep); area.addEventListener('touchend',()=>setTimeout(keep,0));
  const onSel=()=>{ if(!area.isConnected){ document.removeEventListener('selectionchange',onSel); return; } keep(); }; document.addEventListener('selectionchange',onSel);
  let picked=null;
  area.addEventListener('click',e=>{ if(picked) picked.classList.remove('picked'); picked = e.target.tagName==='IMG' ? e.target : null; if(picked) picked.classList.add('picked'); });
  const caretIn=el=>{ const r=document.createRange(); r.selectNodeContents(el); r.collapse(true); const s=getSelection(); s.removeAllRanges(); s.addRange(r); saved=r.cloneRange(); };
  const blockAtCaret=()=>{ const s=getSelection(); const n=s.anchorNode || (saved&&saved.startContainer); const el=n&&(n.nodeType===1?n:n.parentElement); const b=el&&el.closest('.callout,table,blockquote,hr'); return b&&area.contains(b)?b:null; };
  const insertBlock=html=>{ const s=getSelection(); const n=(s.rangeCount&&area.contains(s.anchorNode))?s.anchorNode:(saved&&saved.startContainer); let blk=n&&(n.nodeType===1?n:n.parentElement);
    while(blk && blk!==area && blk.parentElement!==area) blk=blk.parentElement;
    const tmp=document.createElement('div'); tmp.innerHTML=html; const nodes=[...tmp.childNodes];
    if(!blk || blk===area || !area.contains(blk)) area.append(...nodes);
    else if(!blk.textContent.trim() && !blk.querySelector('img,table')) blk.replaceWith(...nodes);
    else blk.after(...nodes);
    return nodes[0]; };
  const removeBlock=b=>{ const p=document.createElement('p'); p.innerHTML='<br>'; b.replaceWith(p); caretIn(p); changed(); };
  area.addEventListener('beforeinput',e=>{
    if(e.inputType!=='deleteContentBackward') return;
    const s=getSelection(); if(!s.isCollapsed||!s.anchorNode) return;
    const el=s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement; const c=el&&el.closest('.callout');
    if(c && area.contains(c) && !c.textContent.trim() && !c.querySelector('img')){ e.preventDefault(); removeBlock(c); }
  });
  async function insertImageFile(f){ if(!f) return; try{ setSave('上傳圖片…'); const d=await fileToCompressed(f); const id=await Store.putImg(d); const src=await Store.imgSrc(id); restore(); document.execCommand('insertHTML',false,`<p><img data-img="${id}" src="${src}"></p><p><br></p>`); changed(); }catch(e){ toast('圖片上傳失敗'); setSave(''); } }
  file.addEventListener('change',()=>{ insertImageFile(file.files[0]); file.value=''; });
  $('.ed-bar',w).addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
  $('.ed-bar',w).addEventListener('pointerdown',e=>{ if(e.target.closest('button') && e.pointerType==='mouse') e.preventDefault(); });
  $('.ed-bar',w).addEventListener('click',e=>{
    const b=e.target.closest('[data-ed]'); if(!b) return; const a=b.dataset.ed;
    if(a==='done'){ if(onDone) onDone(); return; }
    if(a==='hlmenu'){ bar.innerHTML=hlBar; bar.scrollLeft=0; return; }
    if(a==='hl-back'){ bar.innerHTML=mainBar; return; }
    if(['mark','hl-pink','hl-blue','ul-red','hl-none'].includes(a)){ restore();
      if(a==='hl-none') unmarkSel(); else if(!wrapSel(a==='mark'?'mark':'span', a==='mark'?'':a)){ toast('先選取要畫重點的文字'); return; }
      bar.innerHTML=mainBar; changed(); return; }
    if(a==='delblock'){ if(picked && area.contains(picked)){ const par=picked.parentElement; picked.remove(); if(par&&par!==area&&!par.textContent.trim()&&!par.querySelector('img')) removeBlock(par); else changed(); picked=null; return; }
      restore(); const blk=blockAtCaret(); if(blk) removeBlock(blk); else toast('先把游標點進要刪的提示框或表格，或點一下圖片'); return; }
    restore();
    const ex=(c,v)=>document.execCommand(c,false,v);
    if(['h2','h3','p'].includes(a)) ex('formatBlock',a.toUpperCase()==='P'?'P':a.toUpperCase());
    else if(['bold','italic','underline'].includes(a)) ex(a);
    else if(a==='mark'){ const s=getSelection().toString(); if(s) ex('insertHTML',`<mark>${esc(s)}</mark>`); }
    else if(['hl-pink','hl-blue','ul-red'].includes(a)){ const s=getSelection().toString(); if(s) ex('insertHTML',`<span class="${a}">${esc(s)}</span>`); else toast('先選取要標記的文字'); }
    else if(a==='red'){ const s=getSelection().toString(); if(s) ex('insertHTML',`<span class="c-red">${esc(s)}</span>`); }
    else if(a==='ul') ex('insertUnorderedList'); else if(a==='ol') ex('insertOrderedList');
    else if(a.startsWith('c-')){ const col=a.slice(2); const title={amber:'重點',blue:'考試提醒',red:'易混淆',green:'實務見解'}[col]; const s=getSelection().toString();
      if(s) ex('delete');
      const nc=insertBlock(`<div class="callout ${col}"><b>${title}</b><br>${s?esc(s):'在這裡輸入內容'}</div><p><br></p>`);
      const t=nc.lastChild; const r=document.createRange(); if(t&&t.nodeType===3&&!s){ r.selectNodeContents(t); } else { r.selectNodeContents(nc); r.collapse(false); } const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); saved=r.cloneRange(); }
    else if(a==='table'){ const r=`<tr><td><br></td><td><br></td><td><br></td></tr>`; const tb=insertBlock(`<table><thead><tr><th>項目</th><th>A</th><th>B</th></tr></thead><tbody>${r}${r}</tbody></table><p><br></p>`); caretIn(tb.querySelector('th')); }
    else if(a==='img'){ file.click(); return; }
    else if(a==='link'){ const sel=getSelection().toString(); openForm('插入判決或網址連結',[{k:'url',l:'網址',ph:'https://judgment.judicial.gov.tw/…'},{k:'text',l:'顯示文字',v:sel}],v=>{ restore(); if(v.url) ex('insertHTML',`<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.text||v.url)}</a>`); changed(); }); return; }
    else if(a==='plink'){ pickOne('連到其他條文',p=>{ restore(); ex('insertHTML',`<a class="plink" href="#p-${p.id}">→ ${esc(p.title)}</a>&nbsp;`); changed(); }); return; }
    else if(a==='hr') ex('insertHorizontalRule');
    else if(a==='clear'){ ex('removeFormat'); ex('formatBlock','P'); }
    changed();
  });
  return w;
}

/* ============ modals ============ */
function modal(html,onMount){
  const m=document.createElement('div'); m.className='mask'; m.innerHTML=`<div class="modal">${html}</div>`;
  m.addEventListener('mousedown',e=>{ if(e.target===m) m.remove(); });
  document.body.appendChild(m); onMount&&onMount(m, ()=>m.remove()); const f=$('input,textarea',m); if(f) setTimeout(()=>f.focus(),30); return m;
}
function askConfirm(msg,cb,okText='刪除'){ modal(`<h3>確定嗎？</h3><div class="sub">${esc(msg)}</div><div class="acts"><button class="btn" data-x>取消</button><button class="btn pri" data-ok>${okText}</button></div>`,(m,close)=>{ $('[data-x]',m).onclick=close; $('[data-ok]',m).onclick=()=>{close();cb();}; }); }

/* generic form. field: {k,l,v,ph,type:'text'|'textarea'|'select'|'tags'|'links', opts} */
function openForm(title,fields,onSave,extra){
  const fh=f=>{
    const v=f.v??'';
    if(f.type==='textarea') return `<label>${f.l}</label><textarea name="${f.k}" placeholder="${esc(f.ph||'')}" rows="${f.rows||4}">${esc(v)}</textarea>`;
    if(f.type==='select') return `<label>${f.l}</label><select name="${f.k}">${f.opts.map((o,i)=>`<option value="${i}" ${+v===i?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    if(f.type==='tags'){ const all=[...new Set([...PRESET_TAGS,...allTags(),...(v||[])])];
      return `<label>${f.l}</label><div class="chipsel" data-tags="${f.k}">${all.map(t=>`<span class="tag t-${esc(t)} ${(v||[]).includes(t)?'on':''}" data-t="${esc(t)}">${esc(t)}</span>`).join('')}<input placeholder="＋自訂標籤，按 Enter" style="width:160px;padding:2px 10px;font-size:13px;border-radius:999px" data-newtag></div>`; }
    if(f.type==='links') return `<label>${f.l}</label><input placeholder="篩選章節或條文…" data-pfilter><div class="picker" data-links="${f.k}">${pickerHtml(v||[])}</div>`;
    return `<label>${f.l}</label><input name="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.list?`list="dl-${f.k}"`:''}>${f.list?`<datalist id="dl-${f.k}">${f.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  };
  modal(`<h3>${esc(title)}</h3><form>${fields.map(fh).join('')}<div class="acts">${extra?`<button type="button" class="btn ghost danger" data-del style="margin-right:auto">刪除</button>`:''}<button type="button" class="btn" data-x>取消</button><button class="btn pri">儲存</button></div></form>`,(m,close)=>{
    $('[data-x]',m).onclick=close;
    if(extra) $('[data-del]',m).onclick=()=>{ close(); extra(); };
    $$('.chipsel',m).forEach(cs=>{ cs.addEventListener('click',e=>{ const t=e.target.closest('[data-t]'); if(t) t.classList.toggle('on'); });
      const ni=$('[data-newtag]',cs); ni.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const t=ni.value.trim(); if(!t) return; const s=document.createElement('span'); s.className='tag on t-'+t; s.dataset.t=t; s.textContent=t; cs.insertBefore(s,ni); ni.value=''; } }); });
    const pf=$('[data-pfilter]',m); if(pf) pf.addEventListener('input',()=>{ const k=pf.value.toLowerCase(); $$('.picker label',m).forEach(l=>{ l.style.display=l.textContent.toLowerCase().includes(k)?'':'none'; }); });
    $('form',m).addEventListener('submit',e=>{ e.preventDefault(); const out={};
      fields.forEach(f=>{ if(f.type==='tags') out[f.k]=$$(`[data-tags="${f.k}"] .tag.on`,m).map(x=>x.dataset.t);
        else if(f.type==='links') out[f.k]=$$(`[data-links="${f.k}"] input:checked`,m).map(x=>x.value);
        else if(f.type==='select') out[f.k]=+$(`[name="${f.k}"]`,m).value;
        else out[f.k]=$(`[name="${f.k}"]`,m).value.trim(); });
      close(); onSave(out); });
  });
}
const allTags=()=>[...new Set([...db.points,...db.chapters,...db.judgments,...db.questions].flatMap(x=>x.tags||[]))];
function pickerHtml(sel){
  return db.subjects.map(s=>{ const cs=db.chapters.filter(c=>c.subjectId===s.id); if(!cs.length) return '';
    return `<div class="pg">${esc(s.name)}</div>`+cs.map(c=>`<label><input type="checkbox" value="${c.id}" ${sel.includes(c.id)?'checked':''}><b>${esc(c.name)}</b></label>`+
      db.points.filter(p=>p.chapterId===c.id).map(p=>`<label class="pl"><input type="checkbox" value="${p.id}" ${sel.includes(p.id)?'checked':''}>${esc(p.title)}${p.ref?' '+esc(p.ref):''}</label>`).join('')).join(''); }).join('') || '<div class="empty">先建立章節與條文，才能連結。</div>';
}
function pickOne(title,cb){
  modal(`<h3>${esc(title)}</h3><input placeholder="篩選…" data-pfilter><div class="picker">${db.points.map(p=>`<label data-pid="${p.id}" style="cursor:pointer">${esc(p.title)} <span style="color:var(--ink3);font-size:12.5px">${esc(chOfPoint(p)?.name||'')}</span></label>`).join('')||'<div class="empty">還沒有條文。</div>'}</div><div class="acts"><button class="btn" data-x>取消</button></div>`,(m,close)=>{
    $('[data-x]',m).onclick=close;
    $('[data-pfilter]',m).addEventListener('input',e=>{ const k=e.target.value.toLowerCase(); $$('[data-pid]',m).forEach(l=>l.style.display=l.textContent.toLowerCase().includes(k)?'':'none'); });
    $$('[data-pid]',m).forEach(l=>l.onclick=()=>{ close(); cb(db.points.find(p=>p.id===l.dataset.pid)); });
  });
}

/* ============ actions ============ */
const touch=o=>{ o.updated=Date.now(); persist(); render(); };
const A={
  theme(){ ls.set('lexnote-theme', ls.get('lexnote-theme','light')==='dark'?'light':'dark'); applyTheme(); render(); },
  search(){ go('search'); },
  reload(){ location.reload(); },
  tag(el){ searchQ='#'+el.dataset.tag; go('search'); },
  zoom(el,e){ if(e.target.closest('button')) return; const im=$('img',el); lightbox(im.src); },
  addSubject(){ openForm('新增科目',[{k:'name',l:'科目名稱',ph:'例如：行政法'},{k:'sub',l:'副標',ph:'例如：總論・各論'}],v=>{ if(!v.name) return; const s={id:'s'+uid(),...v}; db.subjects.push(s); persist(); go('s-'+s.id); }); },
  editSubject(el){ const s=byId(el.dataset.id); openForm('編輯科目',[{k:'name',l:'科目名稱',v:s.name},{k:'sub',l:'副標',v:s.sub}],v=>{ Object.assign(s,v); touch(s); },
    ()=>askConfirm(`刪除「${s.name}」會一併刪除底下所有章節與條文。`,()=>{ const cs=db.chapters.filter(c=>c.subjectId===s.id).map(c=>c.id); db.points=db.points.filter(p=>!cs.includes(p.chapterId)); db.chapters=db.chapters.filter(c=>c.subjectId!==s.id); db.subjects=db.subjects.filter(x=>x!==s); persist(); go(''); })); },
  addChapter(el){ const sid=el.dataset.id; const parts=[...new Set(db.chapters.filter(c=>c.subjectId===sid).map(c=>c.part).filter(Boolean)),'總則','分則'];
    openForm('新增章節',[{k:'name',l:'章節名稱',ph:'例如：妨害性自主罪章'},{k:'part',l:'分類',ph:'例如：分則',list:[...new Set(parts)]},{k:'ref',l:'法條範圍',ph:'例如：刑法第 221 條以下'},{k:'tags',l:'標籤',type:'tags',v:[]}],v=>{ if(!v.name) return; const c={id:'c'+uid(),subjectId:sid,diagrams:[],supplement:'',...v}; db.chapters.push(c); touch(c); go('c-'+c.id); }); },
  editChapter(el){ const c=byId(el.dataset.id); openForm('編輯章節',[{k:'name',l:'章節名稱',v:c.name},{k:'part',l:'分類',v:c.part,list:['總則','分則']},{k:'ref',l:'法條範圍',v:c.ref},{k:'tags',l:'標籤',type:'tags',v:c.tags||[]}],v=>{ Object.assign(c,v); touch(c); },
    ()=>askConfirm(`刪除「${c.name}」會一併刪除裡面的條文（判決和考題會保留）。`,()=>{ db.points=db.points.filter(p=>p.chapterId!==c.id); db.chapters=db.chapters.filter(x=>x!==c); persist(); go('s-'+c.subjectId); })); },
  addPoint(el){ openForm('新增條文',[{k:'title',l:'條文名稱',ph:'例如：強制性交罪'},{k:'ref',l:'條號',ph:'例如：§221'},{k:'tags',l:'標籤',type:'tags',v:[]}],v=>{ if(!v.title) return; const p={id:'p'+uid(),chapterId:el.dataset.id,html:'',...v,updated:Date.now()}; db.points.push(p); persist(); editing=p.id+':html'; go('p-'+p.id); }); },
  editPointMeta(el){ const p=byId(el.dataset.id); const opts=db.chapters.map(c=>c.name);
    openForm('條文資訊',[{k:'title',l:'條文名稱',v:p.title},{k:'ref',l:'條號',v:p.ref},{k:'ch',l:'所屬章節',type:'select',opts,v:db.chapters.findIndex(c=>c.id===p.chapterId)},{k:'tags',l:'標籤',type:'tags',v:p.tags||[]}],v=>{ p.title=v.title; p.ref=v.ref; p.tags=v.tags; p.chapterId=db.chapters[v.ch]?.id||p.chapterId; touch(p); }); },
  delPoint(el){ const p=byId(el.dataset.id); askConfirm(`刪除條文「${p.title}」？`,()=>{ db.points=db.points.filter(x=>x!==p); persist(); go('c-'+p.chapterId); }); },
  star(el){ const p=byId(el.dataset.id); p.star=!p.star; touch(p); },
  toggleEdit(el){ const k=el.dataset.id+':'+el.dataset.field; editing = editing===k?null:k; if(!editing){ setSave(saveState==='編輯中…'?'儲存中…':saveState); } render(); },
  addDiagram(el){ const c=byId(el.dataset.id); const f=document.createElement('input'); f.type='file'; f.accept='image/*'; f.multiple=true;
    f.onchange=async()=>{ for(const file of f.files){ try{ setSave('上傳圖片…'); const d=await fileToCompressed(file); const id=await Store.putImg(d); (c.diagrams=c.diagrams||[]).push({img:id,cap:file.name.replace(/\.[^.]+$/,'')}); }catch(e){ toast('有圖片上傳失敗'); } } touch(c); }; f.click(); },
  capDiagram(el){ const c=byId(el.dataset.id), d=c.diagrams[+el.dataset.i]; openForm('圖片名稱',[{k:'cap',l:'名稱',v:d.cap}],v=>{ d.cap=v.cap; touch(c); }); },
  delDiagram(el){ const c=byId(el.dataset.id); askConfirm('刪除這張體系圖？',()=>{ c.diagrams.splice(+el.dataset.i,1); touch(c); }); },
  addJudgment(el){ judgmentForm({links:el.dataset.link?[el.dataset.link]:[],tags:[]}); },
  editJudgment(el){ judgmentForm(byId(el.dataset.id)); },
  addQuestion(el){ questionForm({links:el.dataset.link?[el.dataset.link]:[],tags:[],status:0}); },
  editQuestion(el){ questionForm(byId(el.dataset.id)); },
  qstatus(el){ const q=byId(el.dataset.id); q.status=+el.dataset.s; touch(q); },
  settings(){ settings(); },
};
function judgmentForm(j){
  const isNew=!j.id;
  openForm(isNew?'新增判決':'編輯判決',[{k:'court',l:'法院',v:j.court,ph:'例如：最高法院',list:['最高法院','憲法法庭','臺灣高等法院','最高行政法院']},{k:'no',l:'裁判字號',v:j.no,ph:'例如：○○年度台上字第○○號'},{k:'date',l:'裁判日期',v:j.date,ph:'例如：113/05/20'},{k:'url',l:'判決連結',v:j.url,ph:'貼上司法院裁判書查詢的網址'},{k:'issue',l:'核心爭點',v:j.issue},{k:'summary',l:'判決摘要與個人評註',type:'textarea',v:j.summary,rows:5},{k:'tags',l:'標籤',type:'tags',v:j.tags||[]},{k:'links',l:'關聯章節／條文（可複選）',type:'links',v:j.links||[]}],v=>{
    if(isNew){ const n={id:'j'+uid(),...v,updated:Date.now()}; db.judgments.push(n); } else Object.assign(j,v,{updated:Date.now()}); persist(); render(); },
    isNew?null:()=>askConfirm('刪除這筆判決？',()=>{ db.judgments=db.judgments.filter(x=>x!==j); persist(); render(); }));
}
function questionForm(q){
  const isNew=!q.id; const exams=[...new Set(['律師一試','律師二試','司法官二試','司律一試','研究所考試',...db.questions.map(x=>x.exam).filter(Boolean)])];
  openForm(isNew?'新增考題':'編輯考題',[{k:'exam',l:'考試名稱',v:q.exam,list:exams},{k:'year',l:'年度',v:q.year,ph:'例如：113'},{k:'num',l:'題號',v:q.num},{k:'type',l:'題型',v:q.type,list:['申論題','選擇題','實例題']},{k:'content',l:'題目內容',type:'textarea',v:q.content,rows:5},{k:'answer',l:'擬答',type:'textarea',v:q.answer,rows:6},{k:'status',l:'作答狀態',type:'select',opts:STATUS,v:q.status||0},{k:'tags',l:'標籤',type:'tags',v:q.tags||[]},{k:'links',l:'關聯章節／條文（可複選）',type:'links',v:q.links||[]}],v=>{
    if(isNew){ db.questions.push({id:'q'+uid(),...v,updated:Date.now()}); } else Object.assign(q,v,{updated:Date.now()}); persist(); render(); },
    isNew?null:()=>askConfirm('刪除這題？',()=>{ db.questions=db.questions.filter(x=>x!==q); persist(); render(); }));
}
function lightbox(src){ const l=document.createElement('div'); l.className='lightbox'; l.innerHTML=`<img src="${src}">`; l.onclick=()=>l.remove(); document.body.appendChild(l); }
function settings(){
  modal(`<h3>設定</h3>
    <label>備份</label><div class="sub" style="font-size:14px">筆記只存在這台裝置的瀏覽器裡。<b>下載備份檔</b>會把全部筆記和圖片存成一個檔案；到另一台裝置打開這個網站，按<b>匯入備份檔</b>選這個檔案，就能把筆記搬過去。</div>
    <div class="row" style="margin-top:10px"><button class="btn" data-exp>下載備份檔</button><button class="btn" data-imp>匯入備份檔</button><input type="file" accept=".json,application/json" hidden></div>
    ${Store.mode==='api'?`<label>帳號</label><button class="btn" data-logout>登出這台裝置</button>`:''}
    <div class="acts"><button class="btn" data-x>關閉</button></div>`,(m,close)=>{
    $('[data-x]',m).onclick=close;
    const data=async()=>{ const ids=new Set(); const scan=h=>{ (h||'').replace(/data-img="([^"]+)"/g,(_,i)=>ids.add(i)); };
      db.points.forEach(p=>scan(p.html)); db.chapters.forEach(c=>{ scan(c.supplement); (c.diagrams||[]).forEach(d=>ids.add(d.img)); });
      const imgs={}; for(const i of ids){ const v=await Store.imgSrc(i); if(v) imgs[i]=v; }
      return JSON.stringify({lexnote:1,exported:Date.now(),db,imgs}); };
    $('[data-exp]',m).onclick=async()=>{ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([await data()],{type:'application/json'})); a.download=`lexnote-備份-${fmtDate(Date.now()).replace(/\//g,'')}.json`; document.body.appendChild(a); a.click(); a.remove(); ls.set('lexnote-lastbackup',Date.now()); toast('已下載備份檔'); close(); render(); }catch(e){ toast('下載失敗'); } };
    const fi=$('input[type=file]',m);
    $('[data-imp]',m).onclick=()=>fi.click();
    fi.onchange=async()=>{ try{ const raw=JSON.parse(await fi.files[0].text()); const d=normalize(raw.lexnote?raw.db:raw); const imgs=raw.imgs||{}; close(); askConfirm('匯入會用備份檔取代這台裝置上目前全部的筆記。',async()=>{ for(const [k,v] of Object.entries(imgs)){ Store.imgCache[k]=v; await idbPutWait(k,v); } db=d; persist(); go(''); render(); toast('匯入完成'); },'取代'); }catch(e){ toast('這個檔案不是正確的備份檔'); } };
    const lo=$('[data-logout]',m); if(lo) lo.onclick=async()=>{ await fetch('/api/logout',{method:'POST',credentials:'same-origin'}); location.reload(); };
  });
}

/* event delegation */
document.addEventListener('click',e=>{
  const sc=e.target.closest('[data-scroll]'); if(sc){ e.preventDefault(); document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const a=e.target.closest('[data-act]');
  if(a && !a.closest('.modal') && A[a.dataset.act]){ e.preventDefault(); e.stopPropagation(); A[a.dataset.act](a,e); return; }
  const g=e.target.closest('[data-go]'); if(g && !e.target.closest('a,button')){ go(g.dataset.go); return; }
  const im=e.target.closest('.doc img'); if(im && !im.closest('[contenteditable]')) lightbox(im.src);
});
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form=search]'); if(f){ e.preventDefault(); searchQ=f.q.value; if(route.name==='search') render(); else go('search'); } });
document.addEventListener('input',e=>{ const f=e.target.dataset.filter; if(!f) return;
  const pos=e.target.selectionStart;
  if(f==='jq') jf.q=e.target.value; else if(f==='qq') qf.q=e.target.value; else return;
  render(); const el=$(`[data-filter="${f}"]`); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(_){} } });
document.addEventListener('change',e=>{ const f=e.target.dataset.filter; if(!f) return;
  if(f==='jtag') jf.tag=e.target.value; else if(f==='qstatus') qf.status=e.target.value; else if(f==='qexam') qf.exam=e.target.value; else return; render(); });

/* ============ login ============ */
function viewLogin(){
  $('#app').innerHTML=`<div class="login"><form class="box" id="loginForm"><div class="logo">LEXNOTE<span>.</span></div><div class="sub" style="margin:4px 0 26px">我的法律書房</div>
  <input type="password" name="pw" placeholder="輸入密碼" autocomplete="current-password" style="text-align:center;border-radius:999px;padding:12px 18px">
  <button class="btn pri" style="width:100%;justify-content:center;margin-top:12px;padding:11px">進入書房</button><div class="err" id="loginErr"></div>
  <div class="sub" style="font-size:12.5px;margin-top:16px">每台裝置登入一次後就會記住，不用每次輸入。</div></form></div>`;
  $('#loginForm').onsubmit=async e=>{ e.preventDefault(); const pw=e.target.pw.value; $('#loginErr').textContent='';
    const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({pw})});
    if(r.ok) location.reload(); else $('#loginErr').textContent= r.status===429?'嘗試太多次，請稍等幾分鐘再試':'密碼不對，再試一次'; };
  setTimeout(()=>$('input',$('#app')).focus(),50);
}

/* ============ boot ============ */
(async function(){
  const r=await Store.init();
  if(r.needLogin){ viewLogin(); return; }
  db = r.db ? normalize(r.db) : null;
  if(!db){ db=seed(); try{ await Store.save(db);}catch(e){} }
  route=parseHash(); render();
})();
</script>
